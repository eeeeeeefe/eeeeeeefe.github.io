<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrating to cufeplan.tech...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .box {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .spinner {
            border: 4px solid rgba(0, 123, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #007bff;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <div class="spinner"></div>
    <h2>We've Moved!</h2>
    <p id="msg">Checking your saved data and transferring you to <strong>cufeplan.tech</strong>...</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const TARGET_DOMAIN = "https://cufeplan.tech";

    const firebaseConfig = {
        apiKey: "AIzaSyAIkZ2zMCZ7kDMDRBDr1ql78gB3zlLkBWE",
        authDomain: "uni-planner-6506a.firebaseapp.com",
        projectId: "uni-planner-6506a",
        storageBucket: "uni-planner-6506a.firebasestorage.app",
        messagingSenderId: "639806657370",
        appId: "1:639806657370:web:f066901b679151d0f75963"
    };

    function migrateLocalData() {
        const localData = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('plannerState-')) {
                localData[key] = localStorage.getItem(key);
            }
        }

        const keysCount = Object.keys(localData).length;

        if (keysCount > 0) {
            document.getElementById('msg').textContent = "Transferring your local planner data...";
            const payload = btoa(encodeURIComponent(JSON.stringify(localData)));
            window.location.replace(`${TARGET_DOMAIN}/?migrationData=${encodeURIComponent(payload)}`);
        } else {
            // No data to migrate
            window.location.replace(TARGET_DOMAIN);
        }
    }

    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check if user is logged in via Firebase Auth
        let checked = false;
        onAuthStateChanged(auth, (user) => {
            if (checked) return;
            checked = true;

            if (user) {
                // User uses cloud sync -> Redirect and trigger sign-in prompt on the new site
                window.location.replace(`${TARGET_DOMAIN}/?promptLogin=true`);
            } else {
                // User uses local storage or is new -> Extract local storage
                migrateLocalData();
            }
        });

        // Fallback in case auth check times out
        setTimeout(() => {
            if (!checked) {
                checked = true;
                migrateLocalData();
            }
        }, 1500);

    } catch (e) {
        console.error("Migration error:", e);
        migrateLocalData();
    }
</script>
</body>
</html>
